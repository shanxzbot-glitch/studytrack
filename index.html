<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769ff">
<title>PlanSync</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f6f8fc;
color:#111936
}

button,input{font:inherit}
button{border:0;cursor:pointer}

:root{
--blue:#1769ff;
--blue2:#0b84ff;
--ink:#111936;
--muted:#7d879d;
--card:#fff;
--line:#e8ecf3;
--soft:#edf4ff;
--green:#35b86b;
--purple:#7657f5
}

body{min-height:100vh}
.hidden{display:none!important}

/* ================= LOGIN ================= */

#login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
background:
radial-gradient(circle at 10% 10%,#dceaff 0 20%,transparent 42%),
radial-gradient(circle at 95% 15%,#d9d7ff 0 16%,transparent 38%),
#f7f9fd
}

.login-card{
width:min(430px,100%);
background:rgba(255,255,255,.92);
border:1px solid rgba(255,255,255,.8);
border-radius:34px;
padding:28px;
box-shadow:0 24px 70px rgba(28,55,110,.13);
backdrop-filter:blur(18px)
}

.logo-row{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px
}

.logo{
width:48px;
height:48px;
border-radius:16px;
background:linear-gradient(135deg,#1265ff,#42a5ff);
display:grid;
place-items:center;
color:white;
font-weight:900;
font-size:22px;
box-shadow:0 10px 25px #1769ff35
}

.brand{
font-weight:850;
font-size:21px
}

.login-art{
height:150px;
border-radius:25px;
background:linear-gradient(135deg,#1265ff,#62b8ff);
position:relative;
overflow:hidden;
margin-bottom:28px
}

.login-art:before,
.login-art:after{
content:"";
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.16)
}

.login-art:before{
width:190px;
height:190px;
right:-50px;
top:-80px
}

.login-art:after{
width:130px;
height:130px;
left:-35px;
bottom:-70px
}

.mini-phone{
position:absolute;
width:118px;
height:145px;
left:50%;
top:7px;
transform:translateX(-50%);
border:5px solid #10182f;
border-radius:22px;
background:#f8fbff;
box-shadow:0 16px 30px #071b4830;
padding:20px 12px
}

.mini-phone b{
display:block;
color:#1769ff;
font-size:11px;
margin-bottom:14px
}

.mini-line{
height:9px;
border-radius:8px;
background:#dce8ff;
margin:8px 0
}

.mini-line.w{width:72%}

.mini-task{
height:32px;
border-radius:10px;
background:#1769ff;
margin-top:13px
}

.login-card h1{
font-size:31px;
line-height:1.1;
margin:0 0 9px
}

.login-card p{
color:var(--muted);
margin:0 0 24px;
line-height:1.5
}

.field{
margin:13px 0
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin:0 0 7px
}

.field input{
width:100%;
padding:15px 16px;
border:1px solid var(--line);
border-radius:15px;
outline:none;
background:#f9fbff
}

.field input:focus{
border-color:#8ab4ff;
box-shadow:0 0 0 4px #1769ff12
}

.primary{
width:100%;
padding:16px;
border-radius:17px;
background:linear-gradient(135deg,#1769ff,#1687ff);
color:white;
font-weight:800;
box-shadow:0 12px 25px #1769ff35;
margin-top:10px
}

.demo{
text-align:center;
font-size:12px;
color:#9aa2b3;
margin-top:13px
}

/* ================= APP ================= */

#app{
min-height:100vh;
padding-bottom:92px
}

.topbar{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:#fff;
border-bottom:1px solid #eef1f6;
position:sticky;
top:0;
z-index:10
}

.top-title{
font-size:21px;
font-weight:850
}

.top-sub{
font-size:12px;
color:var(--muted);
margin-top:2px
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
display:grid;
place-items:center;
background:#e9f1ff;
color:#1769ff;
font-weight:900
}

.page{
max-width:720px;
margin:auto;
padding:20px 16px
}

/* ================= HOME ================= */

.hero{
background:linear-gradient(135deg,#1769ff,#4ca9ff);
border-radius:27px;
color:white;
padding:23px;
box-shadow:0 18px 35px #1769ff28;
position:relative;
overflow:hidden
}

.hero:after{
content:"";
position:absolute;
width:180px;
height:180px;
border-radius:50%;
right:-80px;
top:-80px;
background:#ffffff18
}

.hero h2{
margin:0;
font-size:25px;
position:relative;
z-index:1
}

.hero p{
margin:8px 0 0;
color:#eaf4ff;
position:relative;
z-index:1
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;
margin:25px 2px 12px
}

.section-head h3{
margin:0;
font-size:17px
}

.small-btn{
background:#edf4ff;
color:#1769ff;
border-radius:12px;
padding:8px 11px;
font-size:12px;
font-weight:800
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:16px;
margin:10px 0;
box-shadow:0 8px 25px #263b6310
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

.stat{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:14px
}

.stat b{
font-size:22px
}

.stat span{
display:block;
color:var(--muted);
font-size:11px;
margin-top:4px
}

.schedule{
display:flex;
gap:12px;
align-items:center
}

.time{
width:66px;
font-size:12px;
color:#71809a;
font-weight:750
}

.schedule-box{
flex:1;
background:#f7faff;
border:1px solid #e4edfc;
border-left:4px solid #1769ff;
border-radius:14px;
padding:12px
}

.schedule-box b{
font-size:14px
}

.schedule-box span{
display:block;
color:var(--muted);
font-size:11px;
margin-top:3px
}

/* ================= TODO ================= */

.todo-input{
display:flex;
gap:8px
}

.todo-input input{
flex:1;
padding:14px;
border:1px solid var(--line);
border-radius:15px;
outline:none;
background:#fff
}

.todo-input button{
width:50px;
border-radius:15px;
background:#1769ff;
color:#fff;
font-size:22px
}

.filter{
display:flex;
gap:8px;
overflow:auto;
margin:15px 0
}

.filter button{
white-space:nowrap;
padding:8px 12px;
border-radius:12px;
background:#fff;
border:1px solid var(--line);
color:#778197;
font-size:12px;
font-weight:750
}

.filter button.active{
background:#1769ff;
color:white;
border-color:#1769ff
}

.task{
display:flex;
align-items:center;
gap:12px
}

.check{
width:27px;
height:27px;
border-radius:9px;
border:2px solid #cfd8e9;
background:#fff;
display:grid;
place-items:center;
flex:none
}

.check.done{
background:#35b86b;
border-color:#35b86b;
color:white
}

.task-main{
min-width:0;
flex:1
}

.task-title{
font-weight:800
}

.task-title.done{
text-decoration:line-through;
color:#a0a7b5
}

.task-meta{
font-size:12px;
color:var(--muted);
margin-top:4px
}

.tag{
font-size:10px;
font-weight:800;
padding:6px 8px;
border-radius:9px;
background:#eef4ff;
color:#1769ff
}

.empty{
text-align:center;
padding:35px 15px;
color:var(--muted)
}

.empty .emoji{
font-size:42px
}

/* ================= CALENDAR ================= */

.month{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.month b{
font-size:20px
}

.month button{
width:36px;
height:36px;
border-radius:12px;
background:#fff;
border:1px solid var(--line)
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px
}

.dayname{
text-align:center;
font-size:10px;
color:#9aa2b3;
font-weight:800;
padding:5px
}

.day{
min-height:43px;
border-radius:12px;
background:#fff;
border:1px solid var(--line);
display:grid;
place-items:center;
font-size:12px
}

.day.today{
background:#1769ff;
color:white;
border-color:#1769ff;
font-weight:850
}

.day.muted{
color:#c5cad5;
background:#fafbfc
}

/* ================= PROFILE ================= */

.profile-head{
text-align:center;
padding:25px 0
}

.big-avatar{
width:82px;
height:82px;
border-radius:27px;
margin:auto;
display:grid;
place-items:center;
background:linear-gradient(135deg,#1769ff,#7c5cff);
color:white;
font-size:30px;
font-weight:900;
box-shadow:0 15px 30px #1769ff30
}

.profile-head h2{
margin:12px 0 4px
}

.profile-head p{
margin:0;
color:var(--muted)
}

.setting{
display:flex;
align-items:center;
gap:13px;
padding:15px 2px;
border-bottom:1px solid #eef1f6
}

.setting:last-child{
border:0
}

.setting-icon{
width:38px;
height:38px;
border-radius:12px;
background:#eef4ff;
display:grid;
place-items:center
}

.setting-main{
flex:1
}

.setting-main b{
font-size:14px
}

.setting-main span{
display:block;
font-size:11px;
color:var(--muted);
margin-top:2px
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
position:fixed;
z-index:30;
bottom:0;
left:0;
right:0;
height:76px;
background:rgba(255,255,255,.96);
border-top:1px solid #e8ecf3;
display:flex;
align-items:center;
justify-content:space-around;
padding:8px max(12px,env(safe-area-inset-left))
calc(8px + env(safe-area-inset-bottom));
backdrop-filter:blur(16px)
}

.nav-btn{
background:transparent;
color:#9aa3b5;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
width:66px;
height:56px;
border-radius:15px;
transition:.18s
}

.nav-btn .ico{
font-size:21px;
line-height:1
}

.nav-btn span{
font-size:10px;
font-weight:750
}

.nav-btn.active{
color:#1769ff;
background:#eef5ff
}

.add-btn{
width:52px;
height:52px;
border-radius:17px;
background:#1769ff;
color:#fff;
font-size:27px;
box-shadow:0 10px 23px #1769ff3b
}

.add-btn:active{
transform:scale(.95)
}

.loading{
text-align:center;
padding:50px 20px;
color:var(--muted)
}

.error{
background:#fff1f1;
border:1px solid #ffd3d3;
color:#c33;
padding:14px;
border-radius:15px;
margin:15px 0;
font-size:13px
}

@media(min-width:700px){

.bottom-nav{
left:50%;
right:auto;
width:520px;
transform:translateX(-50%);
border:1px solid var(--line);
border-radius:22px 22px 0 0
}

.page{
padding-top:28px
}

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="login">

<div class="login-card">

<div class="logo-row">

<div class="logo">P</div>

<div class="brand">PlanSync</div>

</div>

<div class="login-art">

<div class="mini-phone">

<b>Today</b>

<div class="mini-line"></div>

<div class="mini-line w"></div>

<div class="mini-task"></div>

</div>

</div>

<h1>
Plan your day.<br>
Stay one step ahead.
</h1>

<p>
Your timetable, study plan and to-do list —
together in one simple space.
</p>

<div class="field">

<label>Name</label>

<input
id="loginName"
type="text"
placeholder="Enter your name"
>

</div>

<div class="field">

<label>Email</label>

<input
id="loginEmail"
type="email"
placeholder="you@example.com"
>

</div>

<button
class="primary"
onclick="login()"
>
Get Started&nbsp; →
</button>

<div class="demo">
Your data is securely stored in the cloud.
</div>

</div>

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">

<header class="topbar">

<div>

<div
class="top-title"
id="topTitle"
>
Home
</div>

<div
class="top-sub"
id="topSub"
>
Let's organize your day 👋
</div>

</div>

<div
class="avatar"
id="avatar"
>
P
</div>

</header>

<main
id="content"
class="page"
></main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<button
class="nav-btn active"
data-page="home"
onclick="go('home')"
>

<div class="ico">⌂</div>

<span>Home</span>

</button>


<button
class="nav-btn"
data-page="calendar"
onclick="go('calendar')"
>

<div class="ico">▦</div>

<span>Calendar</span>

</button>


<!-- + NOW OPENS TODO — NO POPUP -->

<button
class="add-btn"
onclick="go('todo')"
>
+
</button>


<button
class="nav-btn"
data-page="todo"
onclick="go('todo')"
>

<div class="ico">☑</div>

<span>To-do</span>

</button>


<button
class="nav-btn"
data-page="profile"
onclick="go('profile')"
>

<div class="ico">◯</div>

<span>Profile</span>

</button>

</nav>

</section>


<script>

/* =====================================================
SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
'https://qpqkpmckvugrrooknzzn.supabase.co';

const SUPABASE_KEY =
'sb_publishable_yjQXPL_Ye6TBz0NnvsvCfw_zJGDKqVy';

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
APP DATA
===================================================== */

const $ =
id => document.getElementById(id);

let user = null;

let todos = [];

let current = 'home';


/* =====================================================
LOGIN
===================================================== */

async function login(){

const name =
$('loginName').value.trim() || 'Student';

const email =
$('loginEmail').value.trim().toLowerCase();

if(!email){

alert('Please enter your email.');

return;

}


$('loginName').disabled = true;
$('loginEmail').disabled = true;


try{

/*
Find existing user row.
*/

const {data:existing,error:findError} =
await supabaseClient
.from('test_studyhub')
.select('id,name,email')
.eq('email',email)
.is('todo_text',null)
.limit(1);


if(findError)
throw findError;


/*
If user doesn't exist,
create a profile row.
*/

if(!existing || existing.length === 0){

const {error:insertError} =
await supabaseClient
.from('test_studyhub')
.insert({
name:name,
email:email
});

if(insertError)
throw insertError;

}


/*
Keep user only in memory.
NOT localStorage.
*/

user = {
name:name,
email:email
};


await loadTodos();

startApp();


}catch(error){

console.error(error);

alert(
'Could not connect to Supabase.\n\n' +
(error.message || 'Unknown error')
);

$('loginName').disabled = false;
$('loginEmail').disabled = false;

}

}


/* =====================================================
START APP
===================================================== */

function startApp(){

$('login').classList.add('hidden');

$('app').classList.remove('hidden');

$('avatar').textContent =
(user?.name || 'P')[0].toUpperCase();

go('home');

}


/* =====================================================
LOAD TODOS FROM SUPABASE
===================================================== */

async function loadTodos(){

if(!user?.email){

todos = [];

return;

}


const {data,error} =
await supabaseClient
.from('test_studyhub')
.select('id,name,email,todo_text,todo_done,todo_time,created_at')
.eq('email',user.email)
.not('todo_text','is',null)
.order('created_at',{ascending:false});


if(error){

console.error(error);

throw error;

}


todos =
(data || []).map(row => ({

id:row.id,

text:row.todo_text,

done:row.todo_done || false,

time:row.todo_time || 'Anytime'

}));

}


/* =====================================================
NAVIGATION
===================================================== */

function go(page){

current = page;


document
.querySelectorAll('.nav-btn')
.forEach(button => {

button.classList.toggle(
'active',
button.dataset.page === page
);

});


const titles = {

home:[
'Home',
'Let’s organize your day 👋'
],

calendar:[
'Calendar',
'See your plan at a glance'
],

todo:[
'To-do',
'Keep small tasks moving'
],

profile:[
'Profile',
'Your PlanSync space'
]

};


$('topTitle').textContent =
titles[page][0];

$('topSub').textContent =
titles[page][1];


if(page === 'home')
renderHome();

if(page === 'calendar')
renderCalendar();

if(page === 'todo')
renderTodo();

if(page === 'profile')
renderProfile();

}


/* =====================================================
HOME
===================================================== */

function renderHome(){

const name =
user?.name || 'Student';

const done =
todos.filter(x => x.done).length;


$('content').innerHTML = `

<section class="hero">

<h2>
Good day, ${escapeHtml(name)}! 👋
</h2>

<p>
You have a clear plan.
Let's get it done one step at a time.
</p>

</section>


<div class="section-head">

<h3>Today</h3>

<button
class="small-btn"
onclick="go('todo')"
>
View to-do
</button>

</div>


<div class="stats">

<div class="stat">

<b>9–5</b>

<span>Class time</span>

</div>


<div class="stat">

<b>${done}</b>

<span>Tasks done</span>

</div>


<div class="stat">

<b>${todos.length}</b>

<span>To-do</span>

</div>

</div>


<div class="section-head">

<h3>Study plan</h3>

<span
style="font-size:11px;color:#8993a8"
>
Today
</span>

</div>


<div class="card">

<div class="schedule">

<div class="time">
9:15 AM
</div>

<div class="schedule-box">

<b>
Class / Institution
</b>

<span>
9:15 AM – 5:00 PM
</span>

</div>

</div>

</div>


<div class="card">

<div class="schedule">

<div class="time">
6:00 PM
</div>

<div class="schedule-box">

<b>
Daily revision
</b>

<span>
Review today's class + short recall
</span>

</div>

</div>

</div>


<div class="card">

<div class="schedule">

<div class="time">
8:00 PM
</div>

<div class="schedule-box">

<b>
Self-test
</b>

<span>
Practice questions from previously studied topics
</span>

</div>

</div>

</div>


<div class="section-head">

<h3>Quick to-do</h3>

<button
class="small-btn"
onclick="go('todo')"
>
＋ Add
</button>

</div>


${
todos
.slice(0,3)
.map(todoHTML)
.join('')
||
`
<div class="empty">

<div class="emoji">✨</div>

<p>
No tasks yet.<br>
Add your first to-do.
</p>

</div>
`
}

`;

}


/* =====================================================
TODO CARD
===================================================== */

function todoHTML(t){

return `

<div class="card">

<div class="task">

<button
class="check ${t.done ? 'done' : ''}"
onclick="toggleTodo('${t.id}')"
>

${t.done ? '✓' : ''}

</button>


<div class="task-main">

<div
class="task-title ${t.done ? 'done' : ''}"
>

${escapeHtml(t.text)}

</div>


<div class="task-meta">

${escapeHtml(t.time || 'Anytime')}

</div>

</div>


<span class="tag">

${t.done ? 'Done' : 'Task'}

</span>

</div>

</div>

`;

}


/* =====================================================
TODO PAGE
===================================================== */

function renderTodo(){

$('content').innerHTML = `

<div class="todo-input">

<input
id="newTodo"
placeholder="What needs to be done?"
onkeydown="if(event.key==='Enter') addTodo()"
>

<button
onclick="addTodo()"
>
+
</button>

</div>


<div class="filter">

<button
class="active"
onclick="filterTodos('all',this)"
>
All
</button>


<button
onclick="filterTodos('open',this)"
>
Open
</button>


<button
onclick="filterTodos('done',this)"
>
Completed
</button>

</div>


<div id="todoList">

${
todos
.map(todoHTML)
.join('')
||
`
<div class="empty">

<div class="emoji">
📝
</div>

<p>
Your to-do list is empty.
</p>

</div>
`
}

</div>

`;

}


/* =====================================================
TODO FILTER
===================================================== */

function filterTodos(type,btn){

document
.querySelectorAll('.filter button')
.forEach(x =>
x.classList.remove('active')
);

btn.classList.add('active');


let arr;


if(type === 'done'){

arr =
todos.filter(x => x.done);

}

else if(type === 'open'){

arr =
todos.filter(x => !x.done);

}

else{

arr = todos;

}


$('todoList').innerHTML =

arr
.map(todoHTML)
.join('')

||

`
<div class="empty">

<div class="emoji">✨</div>

<p>Nothing here.</p>

</div>
`;

}


/* =====================================================
ADD TODO → SUPABASE
===================================================== */

async function addTodo(){

const input =
$('newTodo');

if(!input || !input.value.trim())
return;


if(!user?.email){

alert('Please log in first.');

return;

}


const text =
input.value.trim();


const {data,error} =
await supabaseClient
.from('test_studyhub')
.insert({

name:user.name,

email:user.email,

todo_text:text,

todo_done:false,

todo_time:'Added just now'

})
.select()
.single();


if(error){

console.error(error);

alert(
'Could not save task.\n\n' +
error.message
);

return;

}


/*
Add returned Supabase row
to the current screen.
*/

todos.unshift({

id:data.id,

text:data.todo_text,

done:data.todo_done,

time:data.todo_time

});


input.value='';

renderTodo();

}


/* =====================================================
TOGGLE TODO → SUPABASE
===================================================== */

async function toggleTodo(id){

const t =
todos.find(x => x.id === id);

if(!t)
return;


const newStatus =
!t.done;


const {error} =
await supabaseClient
.from('test_studyhub')
.update({

todo_done:newStatus

})
.eq('id',id)
.eq('email',user.email);


if(error){

console.error(error);

alert(
'Could not update task.\n\n' +
error.message
);

return;

}


t.done =
newStatus;


if(current === 'todo')
renderTodo();

else
renderHome();

}

function renderCalendar(){

const d =
new Date();

const y =
d.getFullYear();

const m =
d.getMonth();

const today =
d.getDate();

const first =
new Date(y,m,1).getDay();

const days =
new Date(y,m+1,0).getDate();


const names =
[
'Sun',
'Mon',
'Tue',
'Wed',
'Thu',
'Fri',
'Sat'
];


let cells =
names.map(x =>

`
<div class="dayname">
${x}
</div>
`

).join('');


for(
let i=0;
i<first;
i++
){

cells +=
`
<div class="day muted"></div>
`;

}


for(
let i=1;
i<=days;
i++
){

cells +=
`
<div
class="day ${i === today ? 'today' : ''}"
>
${i}
</div>
`;

}


$('content').innerHTML = `

onclick="alert('Month navigation can be added next')"

/* =====================================================
HTML ESCAPE
===================================================== */

function escapeHtml(s){

return String(s)
.replace(
/[&<>"']/g,
m =>
({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}
