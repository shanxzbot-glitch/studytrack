<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Exam Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 42px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-box h3 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            height: auto;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Daily Exam Tracker</h1>
            <p>Log your marks, track statistics, and monitor performance across subjects.</p>
        </header>

        <!-- Summary Cards -->
        <div class="stats-overview">
            <div class="stat-box">
                <h3>Total Exams</h3>
                <div class="value" id="totalExams">0</div>
            </div>
            <div class="stat-box">
                <h3>Overall Percentage</h3>
                <div class="value" id="overallPercentage">0%</div>
            </div>
        </div>

        <!-- Add Exam Form -->
        <div class="card">
            <h2>Add New Exam Result</h2>
            <form id="examForm" class="form-grid">
                <div class="input-group">
                    <label for="subject">Subject</label>
                    <select id="subject" required>
                        <option value="Accountancy">Accountancy</option>
                        <option value="Business Studies / Law">Business Studies / Law</option>
                        <option value="Economics">Economics</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="marksObtained">Marks Obtained</label>
                    <input type="number" id="marksObtained" min="0" step="0.5" placeholder="e.g. 18" required>
                </div>
                <div class="input-group">
                    <label for="totalMarks">Total Marks</label>
                    <input type="number" id="totalMarks" min="0.5" step="0.5" placeholder="e.g. 20" required>
                </div>
                <button type="submit">Add Exam</button>
            </form>
        </div>

        <!-- Subject Statistics Breakdown -->
        <div class="card">
            <h2>Subject Statistics</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Exams Taken</th>
                            <th>Total Score</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="subjectStatsBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Exam History Log -->
        <div class="card">
            <h2>Exam History Log</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Score</th>
                            <th>Percentage</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="examHistoryBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Load data from localStorage or default to empty array
        let exams = JSON.parse(localStorage.getItem('daily_exams')) || [];

        const subjectsList = ['Accountancy', 'Business Studies / Law', 'Economics', 'Other'];

        const examForm = document.getElementById('examForm');
        const subjectSelect = document.getElementById('subject');
        const marksObtainedInput = document.getElementById('marksObtained');
        const totalMarksInput = document.getElementById('totalMarks');
        
        const totalExamsEl = document.getElementById('totalExams');
        const overallPercentageEl = document.getElementById('overallPercentage');
        const subjectStatsBody = document.getElementById('subjectStatsBody');
        const examHistoryBody = document.getElementById('examHistoryBody');

        examForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const subject = subjectSelect.value;
            const obtained = parseFloat(marksObtainedInput.value);
            const total = parseFloat(totalMarksInput.value);

            if (obtained > total) {
                alert("Marks obtained cannot be greater than total marks!");
                return;
            }

            const newExam = {
                id: Date.now(),
                subject,
                obtained,
                total
            };

            exams.push(newExam);
            saveAndRender();
            examForm.reset();
        });

        function deleteExam(id) {
            exams = exams.filter(exam => exam.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('daily_exams', JSON.stringify(exams));
            render();
        }

        function render() {
            // Render History Log
            examHistoryBody.innerHTML = '';
            if (exams.length === 0) {
                examHistoryBody.innerHTML = `<tr><td colspan="4" class="empty-state">No exams logged yet. Add your first exam above!</td></tr>`;
            } else {
                exams.slice().reverse().forEach(exam => {
                    const percentage = ((exam.obtained / exam.total) * 100).toFixed(1);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${exam.subject}</td>
                        <td>${exam.obtained} / ${exam.total}</td>
                        <td>${percentage}%</td>
                        <td><button class="delete-btn" onclick="deleteExam(${exam.id})">×</button></td>
                    `;
                    examHistoryBody.appendChild(tr);
                });
            }

            // Render Subject Statistics & Overall Summary
            let totalExamsCount = exams.length;
            let grandObtained = 0;
            let grandTotal = 0;

            subjectStatsBody.innerHTML = '';
            subjectsList.forEach(subj => {
                const subjExams = exams.filter(e => e.subject === subj);
                const count = subjExams.length;
                let subObtained = 0;
                let subTotal = 0;

                subjExams.forEach(e => {
                    subObtained += e.obtained;
                    subTotal += e.total;
                });

                grandObtained += subObtained;
                grandTotal += subTotal;

                const subPercentage = subTotal > 0 ? ((subObtained / subTotal) * 100).toFixed(1) + '%' : '—';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${subj}</strong></td>
                    <td>${count}</td>
                    <td>${subObtained} / ${subTotal}</td>
                    <td>${subPercentage}</td>
                `;
                subjectStatsBody.appendChild(tr);
            });

            // Update Overall Stats
            totalExamsEl.textContent = totalExamsCount;
            overallPercentageEl.textContent = grandTotal > 0 ? ((grandObtained / grandTotal) * 100).toFixed(1) + '%' : '0%';
        }

        // Initial render on load
        render();
    </script>
</body>
</html>
